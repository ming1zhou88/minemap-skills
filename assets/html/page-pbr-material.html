<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
	<title>pbr材质</title>
	<link rel="stylesheet" href="../style/demo.css">
	<!-- 引入MineMap API插件 -->
	<link rel="stylesheet" href="../../dist/minemap.css">
	<script src="../../dist/minemap-dev.js"></script>
	<script src="../js/dat.gui.min.js"></script>
	<style>
		#map {
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>
	<div id="map"></div>
	<script>
		/**
		 * 全局参数设置
		 */
		minemap.domainUrl = "https://minedata.cn";
		// minemap.dataDomainUrl = "https://minedata.cn";
		minemap.serverDomainUrl = "https://minedata.cn";
		minemap.spriteUrl = 'http://192.168.152.123/minemapapi/v4.0.0/sprite/sprite';
		// minemap.serviceUrl = "https://minedata.cn/service/";

		minemap.key = '<your key>';
		minemap.solution = 11001;

		// 定义空底图样式
		var style = {
			"glyphs": "minemap://fonts/{fontstack}/{range}",
			"sprite": "minemap://sprite/sprite",
			"sources": {},
			"layers": [],
			"version": 8
		};

		var center = [121.4694, 31.2286];

		/**
		 * 初始化地图实例
		 */
		var map = new minemap.Map({
			container: 'map',
			style: style, /*底图样式*/
			center, /*地图中心点*/
			zoom: 16, /*地图默认缩放等级*/
			pitch: 50, /*地图俯仰角度*/
			maxZoom: 22, /*地图最大缩放等级*/
			minZoom: 1,  /*地图最小缩放等级*/
			projection: 'MERCATOR'
		});
		map.repaint = true;
		map.enableLight();

		var spherePrimitive

		map.on('load', function () {
			/*添加栅格图*/
			map.addSource("IMAGERY_SOURCE", {
				type: "raster",
				tiles: ["https://staticdata-b.minedata.cn:14434/satellite/{z}/{r}/{c}/{z}_{x}_{y}.jpg"], //瓦片服务地址
				tileSize: 256 //瓦片尺寸
			});

			map.addLayer({
				id: "IMAGERY",
				type: "raster",
				source: "IMAGERY_SOURCE",
				minzoom: 1,
				maxzoom: 23,
				paint: {
					"raster-opacity": 1
				}
			});

			addSpherePrimitive()

			var gui = new dat.GUI();//外部UI
			var paramsGui = gui.addFolder("参数设置");

			var props = {
				"金属度": 0.4,
				"粗糙度": 0.4
			}

			var changeMaterial = function () {
				update(props)
			}

			paramsGui.add(props, "金属度", 0, 1).onChange(changeMaterial);
			paramsGui.add(props, "粗糙度", 0, 1).onChange(changeMaterial);
		})

		function update(props) {
			spherePrimitive._material.metalness = props['金属度']
			spherePrimitive._material.roughness = props['粗糙度']
		}

		function addSpherePrimitive() {
			// 计算modelMatrix
			const matrix = minemap.Transforms.cartographicToFixedFrame(new minemap.Math.Vector3([...center, 160]));
			const rotX = new minemap.Math.Matrix4().rotateX(Math.PI / 2);
			matrix.multiplyRight(rotX);

			// 创建geometry
			const geometry = new minemap.Geometries.SphereGeometry({
				radius: 120,
				widthSegments: 100,
				heightSegments: 100
			});
			// 创建primitive
			spherePrimitive = new minemap.Primitive({
				modelMatrix: matrix,
				geometry: geometry,
				material: new minemap.PhysicalMaterial({
					metalness: 0.4,
					roughness: 0.4,
					pbrMetallicRoughness: {
						baseColorFactor: "#049ef4"
					}
				})
			})
			// 添加primitive
			map.addPrimitive(spherePrimitive);
		}
	</script>
</body>

</html>
